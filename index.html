<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adaptive 2ⁿ 성능 테스트 v5</title>
<style>
body{background:#000;color:#0f0;padding:20px;font-family:Consolas;text-align:center}
#bigN{font-size:48px;font-weight:bold;margin:20px 0;color:#0ff;text-shadow:0 0 10px #0ff}
button{background:#0f0;border:none;padding:10px 20px;font-size:18px;color:#000;font-weight:bold;cursor:pointer;border-radius:10px;margin:10px auto;display:block}
pre{white-space:pre-wrap;word-break:break-word;margin-top:20px;max-height:60vh;overflow:auto;text-align:left;border:1px solid #0f0;padding:10px;border-radius:8px}
</style>
</head>
<body>
<h1>⚡ Adaptive 2ⁿ 성능 테스트 v5 ⚡</h1>
<div id="bigN">2^?</div>
<button id="startBtn">테스트 시작</button>
<div id="controls"></div>
<pre id="log"></pre>

<script>
const bigN = document.getElementById("bigN");
const log = document.getElementById("log");
const btn = document.getElementById("startBtn");
const controls = document.getElementById("controls");

btn.onclick = async () => {
  btn.disabled = true;
  controls.innerHTML = "";
  log.textContent = "🚀 테스트 시작...\n";
  await new Promise(r=>setTimeout(r,300));

  let n = 10;
  let step = 100000000; // 1억
  const lines = [];

  while(true){
    bigN.textContent = `2^${n.toLocaleString()}`;
    const start = performance.now();

    const result = 2n ** BigInt(n);
    const dummy = result % 99991n; // 최적화 방지

    const time = performance.now() - start;
    lines.push(`n=${n} → ${time.toFixed(3)}ms`);
    log.textContent = lines.join("\n");
    log.scrollTop = log.scrollHeight; // 자동 스크롤

    if(time >= 3000){
      log.textContent += `\n\n🚫 중단: 2^${n} 에서 3초 초과 (${time.toFixed(2)}ms)\n`;
      break;
    }

    // 단계 조절
    if(time >= 2000){
      n -= step; if(n<0)n=0;
      step = 1;
    } else if(time >= 1000){
      n -= step; if(n<0)n=0;
      step = 10000000;
    } else {
      step = 100000000;
    }

    await new Promise(r=>setTimeout(r,20));
    n += step;
  }

  // 다운로드 버튼 생성
  const blob = new Blob([lines.join("\n")], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const dl = document.createElement("a");
  dl.href = url;
  dl.download = "2n_benchmark_result.txt";
  dl.textContent = "📥 결과 다운로드";
  Object.assign(dl.style,{
    background:"#0ff",color:"#000",padding:"10px 20px",
    borderRadius:"10px",display:"inline-block",marginTop:"10px"
  });
  controls.appendChild(dl);

  bigN.textContent = "✅ 완료";
  btn.disabled = false;
};
</script>
</body>
</html>
